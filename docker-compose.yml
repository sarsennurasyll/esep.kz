services:
  postgres:
    image: postgres:16-alpine
    container_name: esep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-esep}
      POSTGRES_USER: ${POSTGRES_USER:-esep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-esep}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
