name: CI

on:
  push:
    branches: [main, "hybrid/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Тесты используют H2 и одноразовую PostgreSQL через Testcontainers; реальные выписки в CI не используются.
      - name: Test
        run: mvn -B -ntp test
      - name: Build image
        run: docker build -q -t esep:ci .
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7
