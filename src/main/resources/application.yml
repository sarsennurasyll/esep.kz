server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: esep
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/esep}
    username: ${DB_USERNAME:esep}
    password: ${DB_PASSWORD:esep}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
