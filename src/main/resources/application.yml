server:
  # Локальный режим (ADR-0002): сервис доступен только с этого компьютера.
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: esep
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  servlet:
    multipart:
      max-file-size: ${ESEP_MAX_UPLOAD_FILE_SIZE:5MB}
      max-request-size: ${ESEP_MAX_UPLOAD_REQUEST_SIZE:6MB}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/esep}
    username: ${DB_USERNAME:esep}
    password: ${DB_PASSWORD:esep}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

esep:
  security:
    # Имена в заголовке Host, по которым разрешено обращаться к сервису.
    allowed-hosts: ${ESEP_ALLOWED_HOSTS:localhost,127.0.0.1}
  import:
    max-pdf-pages: ${ESEP_MAX_PDF_PAGES:200}
    max-pdf-text-characters: ${ESEP_MAX_PDF_TEXT_CHARACTERS:2000000}
    max-pdf-parse-duration: ${ESEP_MAX_PDF_PARSE_DURATION:20s}
    max-pdf-memory: ${ESEP_MAX_PDF_MEMORY:64MB}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
