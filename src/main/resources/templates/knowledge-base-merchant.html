<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${merchant.name})}"></head>
<body><nav th:replace="~{fragments/layout :: navigation}"></nav><main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4"><div><a class="small" th:href="@{/knowledge-base/merchants}">← База знаний</a><h1 class="h3 mb-0 mt-2" th:text="${merchant.name}"></h1></div><form th:action="@{/knowledge-base/merchants/{id}/delete(id=${merchant.id})}" method="post"><button class="btn btn-outline-danger" type="submit">Удалить</button></form></div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div class="row g-4"><div class="col-lg-7"><div class="card statement-card"><div class="card-body"><h2 class="h5">Карточка получателя</h2><form class="row g-3" th:action="@{/knowledge-base/merchants/{id}(id=${merchant.id})}" method="post"><div class="col-12"><label class="form-label">Название</label><input class="form-control" name="name" th:value="${merchant.name}" required></div><div class="col-md-6"><label class="form-label">Тип</label><select class="form-select" name="merchantType"><option th:each="type : ${merchantTypes}" th:value="${type}" th:text="${type.displayName}" th:selected="${type == merchant.merchantType}"></option></select></div><div class="col-md-6"><label class="form-label">Категория</label><select class="form-select" name="categoryCode"><option th:each="category : ${categories}" th:value="${category.code}" th:text="${category.name}" th:selected="${category.code == merchant.categoryCode}"></option></select></div><div class="col-12"><button class="btn btn-primary" type="submit">Сохранить</button></div></form></div></div></div><div class="col-lg-5"><div class="card statement-card"><div class="card-body"><h2 class="h5">Статистика</h2><dl class="row mb-0"><dt class="col-7">Операций</dt><dd class="col-5 text-end" th:text="${merchant.transactionCount}"></dd><dt class="col-7">Сумма</dt><dd class="col-5 text-end" th:text="${merchant.totalAmount}"></dd><dt class="col-7">Первое появление</dt><dd class="col-5 text-end" th:text="${merchant.firstTransactionDate ?: '—'}"></dd><dt class="col-7">Последняя операция</dt><dd class="col-5 text-end" th:text="${merchant.lastTransactionDate ?: '—'}"></dd></dl></div></div></div></div>
    <div class="card statement-card mt-4"><div class="card-body"><h2 class="h5">Алиасы</h2><p class="text-secondary small">После добавления алиаса все совпадающие неизвестные операции в истории будут связаны с этим получателем.</p><form class="row g-2 mb-3" th:action="@{/knowledge-base/merchants/{id}/aliases(id=${merchant.id})}" method="post"><div class="col-md-9"><input class="form-control" name="aliasName" placeholder="Например, MAGNUM CASH & CARRY" required></div><div class="col-md-3"><button class="btn btn-primary w-100" type="submit">Добавить алиас</button></div></form><div class="table-responsive"><table class="table align-middle"><tbody><tr th:each="alias : ${merchant.aliases}"><td><form class="d-flex gap-2" th:action="@{/knowledge-base/merchants/{id}/aliases/{aliasId}(id=${merchant.id},aliasId=${alias.id})}" method="post"><input class="form-control" name="aliasName" th:value="${alias.aliasName}" required><button class="btn btn-sm btn-outline-primary" type="submit">Сохранить</button></form></td><td class="text-end"><form th:action="@{/knowledge-base/merchants/{id}/aliases/{aliasId}/delete(id=${merchant.id},aliasId=${alias.id})}" method="post"><button class="btn btn-sm btn-outline-danger" type="submit">Удалить</button></form></td></tr><tr th:if="${#lists.isEmpty(merchant.aliases)}"><td class="text-secondary">Алиасы пока не добавлены.</td></tr></tbody></table></div></div></div>
</main></body></html>
