<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Вход')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navigation}"></nav>
<main class="container pb-5">
    <div class="row justify-content-center"><div class="col-md-6 col-lg-5">
        <div class="card import-card"><div class="card-body p-4">
            <h1 class="h3 mb-3">Вход</h1>
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${param.error}" class="alert alert-danger">Неверный адрес или пароль.</div>
            <div th:if="${param.locked}" class="alert alert-danger">Слишком много неудачных попыток. Попробуйте через 15 минут.</div>
            <div th:if="${param.logout}" class="alert alert-light border">Вы вышли из учётной записи.</div>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label">Электронная почта</label>
                    <input id="email" name="email" type="email" class="form-control" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Пароль</label>
                    <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Войти</button>
            </form>
            <p class="small text-secondary mt-3 mb-0">Нет учётной записи? <a th:href="@{/register}">Зарегистрируйтесь</a>
                или <a th:href="@{/check}">проверьте выписку без регистрации</a>.</p>
        </div></div>
    </div></div>
</main>
</body>
</html>
