<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — Esep'">Esep</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-5.3.3.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<nav th:fragment="navigation" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">Esep</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div id="navigation" class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/check}">Проверка без регистрации</a></li>
                <th:block th:if="${currentAccountEmail != null}">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Аналитика</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/statements}">Выписки</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/merchants}">Неизвестные операции</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/purposes}">Назначения</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/import}">Импорт</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/knowledge-base/merchants}">База знаний</a></li>
                    <li class="nav-item" th:if="${currentAccountAdmin}"><a class="nav-link" th:href="@{/knowledge-base/suggestions}">Предложения</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/account}">Аккаунт</a></li>
                </th:block>
                <th:block th:unless="${currentAccountEmail != null}">
                    <li class="nav-item"><a class="nav-link" th:href="@{/login}">Войти</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/register}">Регистрация</a></li>
                </th:block>
            </ul>
        </div>
    </div>
</nav>
</html>
