<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('База знаний продавцов')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navigation}"></nav>
<main class="container pb-5">
    <div class="mb-4"><h1 class="h3 mb-1">База знаний продавцов</h1><p class="text-secondary mb-0">Управляйте получателями платежей, категориями и вариантами их названий.</p></div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div class="card statement-card mb-4"><div class="card-body"><h2 class="h5">Добавить продавца</h2><form class="row g-2" th:action="@{/knowledge-base/merchants}" method="post"><div class="col-md-4"><input class="form-control" name="name" placeholder="Название" required maxlength="255"></div><div class="col-md-3"><select class="form-select" name="merchantType" required><option th:each="type : ${merchantTypes}" th:value="${type}" th:text="${type.displayName}"></option></select></div><div class="col-md-3"><select class="form-select" name="categoryCode" required><option th:each="category : ${categories}" th:value="${category.code}" th:text="${category.name}"></option></select></div><div class="col-md-2"><button class="btn btn-primary w-100" type="submit">Добавить</button></div></form></div></div>
    <form class="row g-2 mb-3" method="get"><div class="col-md-5"><input class="form-control" name="query" th:value="${query}" placeholder="Поиск по продавцу или алиасу"></div><div class="col-md-3"><select class="form-select" name="merchantType"><option value="">Все типы</option><option th:each="type : ${merchantTypes}" th:value="${type}" th:text="${type.displayName}" th:selected="${type == selectedType}"></option></select></div><div class="col-md-3"><select class="form-select" name="categoryCode"><option value="">Все категории</option><option th:each="category : ${categories}" th:value="${category.code}" th:text="${category.name}" th:selected="${category.code == selectedCategory}"></option></select></div><div class="col-md-1"><button class="btn btn-outline-secondary w-100" type="submit">Найти</button></div></form>
    <div class="card statement-card"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Получатель</th><th>Тип</th><th>Категория</th><th class="text-end">Операций</th><th class="text-end">Алиасов</th><th></th></tr></thead><tbody><tr th:each="merchant : ${merchants}"><td><strong th:text="${merchant.name}"></strong><div class="small text-secondary" th:text="${merchant.normalizedName}"></div></td><td th:text="${merchant.merchantType.displayName}"></td><td th:text="${merchant.categoryName}"></td><td class="text-end" th:text="${merchant.transactionCount}"></td><td class="text-end" th:text="${#lists.size(merchant.aliases)}"></td><td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/knowledge-base/merchants/{id}(id=${merchant.id})}">Открыть</a></td></tr><tr th:if="${#lists.isEmpty(merchants)}"><td colspan="6" class="text-secondary">По заданным условиям продавцы не найдены.</td></tr></tbody></table></div></div>
</main>
</body></html>
