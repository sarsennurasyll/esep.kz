<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Главная')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navigation}"></nav>
<main class="container pb-5">
    <section class="hero-card rounded-4 p-4 p-md-5 mb-4">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h1 class="display-6 fw-bold">Понимайте свои банковские операции</h1>
                <p class="lead mb-0">Esep импортирует выписки Kaspi и помогает увидеть структуру расходов.</p>
            </div>
            <div class="col-md-4 text-md-end mt-3 mt-md-0">
                <a class="btn btn-light btn-lg" th:href="@{/import}">Импортировать выписку</a>
            </div>
        </div>
    </section>

    <section>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h4 mb-0">Последние выписки</h2>
            <a th:href="@{/statements}">Все выписки</a>
        </div>
        <div th:if="${#lists.isEmpty(statements)}" class="alert alert-light border">
            Пока нет импортированных выписок. Загрузите первую PDF-выписку Kaspi.
        </div>
        <div th:unless="${#lists.isEmpty(statements)}" class="card statement-card">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead><tr><th>Банк</th><th>Период</th><th>Операций</th><th>Импортирована</th></tr></thead>
                    <tbody>
                    <tr th:each="statement : ${statements}" role="link">
                        <td><a class="table-link d-block" th:href="@{/statements/{id}(id=${statement.id})}" th:text="${statement.bank}">KASPI</a></td>
                        <td th:text="${statement.periodFrom} + ' — ' + ${statement.periodTo}"></td>
                        <td th:text="${statement.transactionCount}"></td>
                        <td th:text="${#temporals.format(statement.importedAt, 'dd.MM.yyyy HH:mm')}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
</body>
</html>
